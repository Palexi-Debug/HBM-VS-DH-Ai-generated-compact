name: Continuum bombs fork
on:
  workflow_dispatch:
  push:
    paths: ['continuum-bombs/**', '.github/workflows/continuum.yml']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # settings.gradle.kts includes ../Golem-Core as composite build: Golem Core sits next to continuum-bombs.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Warfactory-Official/Golem-Core
          ref: 5675ea76693dc0300a4c9fb59af032da5ab4825a # pinned: newer Golem-Core main changed PeripheralExposure and broke the build
          path: Golem-Core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Add swap and show resources
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h; nproc
      - name: Build 1.20.1 Forge
        env:
          CI: "false"
        working-directory: continuum-bombs
        shell: bash
        run: |
          set +e
          bash ./gradlew :1.20.1-forge:build -x test --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Dorg.gradle.caching=false -Dorg.gradle.jvmargs='-Xmx4g -XX:+UseSerialGC -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvm.options=-Xmx1g 2>&1 | tee ../build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # surface the real error as ONE annotation (GitHub shows max 10); skip the Fabric EnvType javac noise
            msg=$(grep -vE "EnvType|^\s*reason:|unknown enum constant" ../build.log | grep -nE "error:|What went wrong|Execution failed|Could not|FAILED|Caused by|BUILD FAILED" -A3 | grep -v '^--$' | tail -40 | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failure::$msg"
          fi
          exit $rc
      - name: Inspect jar
        if: always()
        run: |
          J=$(ls continuum-bombs/versions/1.20.1-forge/build/libs/*.jar 2>/dev/null | grep -v -e sources -e dev | head -1)
          [ -z "$J" ] && J=$(ls continuum-bombs/**/build/libs/*.jar 2>/dev/null | head -1)
          echo "jar: $J"
          unzip -l "$J" > /tmp/jar.txt
          echo "::notice title=Jar contents::$(echo "files: $(wc -l < /tmp/jar.txt); worldgen: $(grep -c 'data/hbm/worldgen/' /tmp/jar.txt); biome_modifier: $(grep -c 'biome_modifier/' /tmp/jar.txt); structure nbt: $(grep -c '\.nbt' /tmp/jar.txt); size: $(du -h "$J" | cut -f1)")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuum-bombs-forge-1.20.1
          path: continuum-bombs/**/build/libs/*.jar
      # A tag like v1.0.1 publishes a GitHub release with the jar and the CurseForge changelog as notes.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          J=$(ls continuum-bombs/versions/1.20.1-forge/build/libs/*.jar | grep -v -e sources -e dev | head -1)
          echo "release jar: $J"
          gh release create "${GITHUB_REF_NAME}" "$J" --title "NTM Continuum - Bombs ${GITHUB_REF_NAME}" --notes-file continuum-bombs/CHANGELOG-CURSEFORGE.md

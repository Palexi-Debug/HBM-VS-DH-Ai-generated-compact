name: Continuum bombs fork
on:
  workflow_dispatch:
  push:
    paths: ['continuum-bombs/**', '.github/workflows/continuum.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # settings.gradle.kts includes ../Golem-Core as composite build: Golem Core sits next to continuum-bombs.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Warfactory-Official/Golem-Core
          ref: main
          path: Golem-Core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build 1.20.1 Forge
        env:
          CI: "false"
        working-directory: continuum-bombs
        run: bash ./gradlew :1.20.1-forge:build -x test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuum-bombs-forge-1.20.1
          path: continuum-bombs/**/build/libs/*.jar

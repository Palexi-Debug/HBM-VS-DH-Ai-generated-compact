name: Continuum bombs fork
on:
  workflow_dispatch:
  push:
    paths: ['continuum-bombs/**', '.github/workflows/continuum.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # settings.gradle.kts includes ../Golem-Core as composite build: Golem Core sits next to continuum-bombs.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Warfactory-Official/Golem-Core
          ref: main
          path: Golem-Core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build 1.20.1 Forge
        env:
          CI: "false"
        working-directory: continuum-bombs
        shell: bash
        run: |
          set +e
          bash ./gradlew :1.20.1-forge:build -x test --no-daemon 2>&1 | tee ../build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # surface the key error lines as annotations (the raw log is not downloadable from the assistant's side)
            grep -nE "What went wrong|error:|Could not|FAILED|Execution failed|not found|Caused by|Where:" -A2 ../build.log | grep -v '^--$' | head -24 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuum-bombs-forge-1.20.1
          path: continuum-bombs/**/build/libs/*.jar

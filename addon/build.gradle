plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.chunky.hbmnukemeka'
version = mod_version
base.archivesName = "hbm-nuke-meka-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    // Distant Horizons API (compile only, DH itself is an optional runtime mod)
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Distant Horizons API 3.0.0 (project Xs0XTOVv, version 1uUP7LpX)
    compileOnly 'maven.modrinth:Xs0XTOVv:1uUP7LpX'
}

tasks.named('processResources') {
    var props = [mod_id: mod_id, mod_version: mod_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

tasks.named('jar') {
    manifest.attributes([
        'Specification-Title': mod_id,
        'Implementation-Version': mod_version
    ])
    finalizedBy 'reobfJar'
}
